[project]
name = "rag-fa"
version = "1.0.0"
description = "محیط کامل ساخت RAG فارسی با LangChain، ChromaDB/Qdrant و پنل وب فارسی"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
